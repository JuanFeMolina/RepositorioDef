<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Buscar por ID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <nav class="mb-4">
        <a href="/admin" class="me-3">Inicio</a>
        <a href="javascript:void(0)" onclick="cerrarSesion()" class="text-danger">Cerrar Sesión</a>
    </nav>

    <div class="d-flex justify-content-between mb-4">
        <h3>🔍 Buscar Camioneta por ID</h3>
        <a href="/admin" class="btn btn-secondary">Volver al Menú</a>
    </div>
    <script>
        async function cerrarSesion() {
           await fetch('/salir', { method: 'POST' })
            window.location.href = '/login';
        }
    </script>
    <div class="input-group mb-3 w-50 shadow-sm">
        <input type="number" id="inputId" class="form-control" placeholder="Ingrese el ID (Ej: 1, 2...)">
        <button class="btn btn-primary" onclick="buscarPorId()">Buscar</button>
    </div>

    <div id="resultado" class="mt-4"></div>

    <script>
        async function buscarPorId() {
            const id = document.getElementById('inputId').value;
            if (!id) return alert("Por favor, ingresá un ID.");

            // Le pegamos a la ruta de camionetas agregando el ID al final
            const respuesta = await fetch('/api/v1/vehiculos/' + id);

            if (respuesta.status === 401 || respuesta.status === 403) return window.location.href = '/login';

            const datos = await respuesta.json();
            const contenedor = document.getElementById('resultado');

            // Si el backend tiró error 404 (no encontrada), mostramos cartel rojo
            if (!respuesta.ok) {
                contenedor.innerHTML = `<div class="alert alert-danger">${datos.error || datos.mensaje}</div>`;
                return;
            }

            // Si todo salió bien, dibujamos una tarjeta con los datos
            contenedor.innerHTML = `
                <div class="card p-4 shadow-sm border-primary" style="width: 20rem;">
                    <h4 class="text-primary">${datos.marca.toUpperCase()} ${datos.modelo}</h4>
                    <hr>
                    <p class="mb-1"><strong>Año:</strong> ${datos.anio}</p>
                    <p class="mb-0"><strong>Precio:</strong> $${datos.precio.toLocaleString('es-AR')}</p>
                </div>`;
        }
    </script>
</body>

</html>
