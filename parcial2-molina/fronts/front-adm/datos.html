<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <nav class="mb-4">
        <a href="/admin" class="me-3">Inicio</a>
        <a href="javascript:void(0)" onclick="cerrarSesion()" class="text-danger">Cerrar Sesión</a>
    </nav>

    <div class="d-flex justify-content-between mb-4">
        <h3>📋 Todas las Camionetas</h3>
        <a href="/admin" class="btn btn-secondary">Volver al Menú</a>
    </div>

    <script>
        async function cerrarSesion() {
            await fetch('/salir', { method: 'POST' })
            window.location.href = '/login';
        }
    </script>

    <table class="table table-striped shadow-sm bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo">
        </tbody>
    </table>

    <script>
        async function cargarInventario() {
            try {
                // Hacemos la petición a tu API. La cookie viaja sola y oculta.
                const respuesta = await fetch('/api/v1/vehiculos');

                // Si la sesión expiró, lo pateamos al login
                if (respuesta.status === 401 || respuesta.status === 403) {
                    return window.location.href = '/login';
                }

                const datos = await respuesta.json();
                let html = '';

                // Recorremos el JSON armando las filas HTML
                datos.forEach(camioneta => {
                    html += `<tr>
                                <td>${camioneta.id}</td>
                                <td><strong>${camioneta.marca}</strong></td>
                                <td>${camioneta.modelo}</td>
                                <td>${camioneta.anio}</td>
                                <td>$${camioneta.precio.toLocaleString('es-AR')}</td>
                             </tr>`;
                });

                // Metemos todo el HTML armado adentro del cuerpo de la tabla
                document.getElementById('tabla-cuerpo').innerHTML = html;
            } catch (error) {
                console.error("Error al cargar:", error);
            }
        }

        // Ejecutamos la función apenas carga la página
        cargarInventario();
    </script>
</body>

</html>
