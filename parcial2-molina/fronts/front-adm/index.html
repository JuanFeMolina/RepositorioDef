<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container mt-4">
        <nav class="mb-4">
            <span class="text-muted me-3">Estás en: Inicio</span>
            <a href="javascript:void(0)" onclick="cerrarSesion()" class="text-danger">Cerrar Sesión</a>
        </nav>
    </div>

    <div class="container mt-2">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2>⚙️ Panel de Control</h2>
        </div>

        <div class="row g-4 text-center">
            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h5>Inventario Completo</h5>
                    <p class="text-muted small">Ver todas las camionetas registradas.</p>
                    <a href="/admin/datos.html" class="btn btn-primary">Ir al Inventario</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h5>Buscar por ID</h5>
                    <p class="text-muted small">Buscar un vehículo específico por su código.</p>
                    <a href="/admin/por-id.html" class="btn btn-primary">Ir al Buscador</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h5>Métricas y Procesos</h5>
                    <p class="text-muted small">Calcular estadísticas según la marca.</p>
                    <a href="/admin/procesos.html" class="btn btn-warning">Ir a Procesos</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cerrarSesion() {
            await fetch('/salir', { method: 'POST' });
            window.location.href = '/login'; 
        }
    </script>
</body>
</html>
